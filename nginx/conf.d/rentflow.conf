# Upstream Flask application
upstream rentflow_app {
    server web:8000 fail_timeout=0;
}

# HTTP Server
# For production with SSL: Uncomment the redirect and configure HTTPS server below
# For development: Keep as-is to serve on HTTP
server {
    listen 80;
    server_name _;  # Replace with your-domain.com in production

    # Uncomment for HTTPS redirect in production:
    # return 301 https://$server_name$request_uri;

    # For HTTP-only (development) or if using external load balancer with SSL:
    include /etc/nginx/conf.d/locations.conf;
}

