# Shared location blocks for RentFlow
# Included by both HTTP and HTTPS server blocks

# Client body size
client_max_body_size 16M;
client_body_buffer_size 128k;

# Timeouts
proxy_connect_timeout 90s;
proxy_send_timeout 90s;
proxy_read_timeout 90s;

# Static files caching
location /static {
    alias /app/website/static;
    expires 7d;
    add_header Cache-Control "public, immutable";
}

# Uploaded files
location /uploads {
    alias /app/uploads;
    expires 7d;
    add_header Cache-Control "private";
}

# Authentication endpoints - stricter rate limiting
location ~ ^/(login|register|reset-password) {
    limit_req zone=auth burst=5 nodelay;
    proxy_pass http://rentflow_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}

# Health check endpoint - no rate limiting
location /health {
    proxy_pass http://rentflow_app;
    proxy_set_header Host $host;
    access_log off;
}

# Main application - general rate limiting
location / {
    limit_req zone=general burst=20 nodelay;
    proxy_pass http://rentflow_app;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # WebSocket support (if needed in future)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# Custom error pages
error_page 502 503 504 /50x.html;
location = /50x.html {
    root /usr/share/nginx/html;
}
