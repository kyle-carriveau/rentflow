[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=website --cov-report=term-missing --cov-report=html
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multi-component workflows)
    views: View/endpoint tests (HTTP requests)
    auth: Authentication tests
    rbac: Role-based access control tests
    models: Database model tests
    financial: Financial calculation tests
    security: Security and permission tests
    property: Property management tests
    tenant: Tenant management tests
    performance: Performance and load tests