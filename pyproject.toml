# Python Project Configuration
# Centralized configuration for code quality tools

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    # Directories
    \.git
  | \.tox
  | \.venv
  | venv
  | env
  | reenv.*
  | build
  | dist
  | migrations
  | instance
  | logs
  | uploads
  | backups
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    "*/migrations/*",
    "*/instance/*",
    "*/logs/*",
    "*/uploads/*",
    "*/backups/*",
    "*/.venv/*",
    "*/venv/*",
    "*/env/*",
    "*/reenv*/*",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true when ready for strict typing
ignore_missing_imports = true
exclude = [
    "migrations/",
    "instance/",
    "logs/",
    "uploads/",
    "backups/",
    ".venv/",
    "venv/",
    "env/",
    "reenv.*/",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=website",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (multiple components)",
    "views: View/endpoint tests",
    "auth: Authentication and authorization tests",
    "models: Database model tests",
    "financial: Financial calculation tests",
    "security: Security and permission tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["website"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
    "*/env/*",
    "*/reenv*/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = [
    "/tests/",
    "/migrations/",
    "/.venv/",
    "/venv/",
    "/env/",
    "/reenv.*/",
]
skips = [
    "B101",  # assert_used - we use assertions in tests
    "B601",  # paramiko_calls - if we use paramiko
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
