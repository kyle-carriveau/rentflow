name: Deploy to Production

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Only deploy if Tests passed AND it was triggered from main branch
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Debug workflow trigger info
        run: |
          echo "=== Workflow Run Information ==="
          echo "Triggered by workflow: ${{ github.event.workflow_run.name }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Event: ${{ github.event_name }}"
          echo "================================"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}  # Deploy exact tested commit

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e

            COMPOSE_FILE="docker-compose.production.yml"

            echo "=== Pre-deployment Checks ==="
            if ! command -v docker &> /dev/null; then
                echo "ERROR: Docker is not installed!"
                exit 1
            fi

            if ! command -v docker compose &> /dev/null; then
                echo "ERROR: Docker Compose is not installed!"
                exit 1
            fi

            echo "✓ Docker and Docker Compose found"

            echo "=== Starting deployment ==="
            cd /home/ubuntu/rentflow

            echo "=== Pulling latest code ==="
            # Fetch and reset to latest (safe - preserves untracked data)
            git fetch origin main
            git reset --hard origin/main
            echo "✓ Code updated to latest commit: $(git rev-parse --short HEAD)"

            echo "=== Verifying deployment structure ==="
            if [ ! -f "$COMPOSE_FILE" ]; then
                echo "ERROR: Docker Compose file not found at: $COMPOSE_FILE"
                exit 1
            fi
            if [ ! -f ".env" ]; then
                echo "ERROR: .env file not found at root directory"
                echo "Please create .env file with required environment variables"
                exit 1
            fi
            echo "✓ Compose file found: $COMPOSE_FILE"
            echo "✓ Environment file found: .env"

            echo "=== Creating directories with correct permissions ==="
            mkdir -p logs uploads instance backups
            chmod 777 logs uploads instance
            touch logs/access.log logs/error.log
            chmod 666 logs/access.log logs/error.log

            echo "=== Backing up PostgreSQL database ==="
            BACKUP_FILE="backups/backup-$(date +%Y%m%d-%H%M%S).sql"
            if docker compose -f "$COMPOSE_FILE" --env-file .env exec -T db pg_dump -U rentflow_user rentflow > "$BACKUP_FILE" 2>/dev/null; then
                echo "✓ Database backed up: $BACKUP_FILE"
            else
                echo "⚠ Warning: Database backup failed (might not exist yet)"
            fi

            echo "=== Cleaning up old backups (keeping last 7 days) ==="
            find backups/ -name "backup-*.sql" -type f -mtime +7 -delete 2>/dev/null || true
            BACKUP_COUNT=$(find backups/ -name "backup-*.sql" -type f 2>/dev/null | wc -l)
            echo "✓ Current backups: $BACKUP_COUNT files"

            echo "=== One-time cleanup: remove orphaned containers ==="
            # Remove any orphaned containers from previous deployments
            # This is safe: only affects stopped/orphaned containers
            # Needed for transition to zero-downtime deployments
            docker compose -f "$COMPOSE_FILE" --env-file .env down --remove-orphans 2>/dev/null || true
            docker system prune -f --volumes=false 2>/dev/null || true
            echo "✓ Cleanup complete - ready for zero-downtime deployment"

            echo "=== Building Docker images ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env build web
            echo "✓ New web image built"

            echo "=== Ensuring database and Redis are running ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env up -d --no-deps db redis
            echo "✓ Database and Redis services ready"

            echo "=== Running database migrations (zero-downtime) ==="
            # Run migrations using temporary container while old web is still serving traffic
            if ! docker compose -f "$COMPOSE_FILE" --env-file .env run --rm --no-deps web flask db upgrade; then
                echo "ERROR: Database migration failed!"
                echo "Old version still running - no downtime occurred"
                docker compose -f "$COMPOSE_FILE" --env-file .env ps
                exit 1
            fi
            echo "✓ Database migrations completed successfully"

            echo "=== Deploying new web container (zero-downtime rolling update) ==="
            # This performs a rolling update: starts new container, waits for health, then stops old
            docker compose -f "$COMPOSE_FILE" --env-file .env up -d --no-deps web
            echo "✓ Web container updated"

            echo "=== Ensuring NGINX is running ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env up -d --no-deps nginx
            echo "✓ NGINX ready"

            echo "=== Waiting for new web container to be healthy ==="
            MAX_WAIT=90
            ELAPSED=0
            HEALTH_CHECK_PASSED=false

            while [ $ELAPSED -lt $MAX_WAIT ]; do
                # Check container health status
                WEB_STATUS=$(docker compose -f "$COMPOSE_FILE" --env-file .env ps web --format "{{.Status}}" 2>/dev/null || echo "")

                if echo "$WEB_STATUS" | grep -q "healthy"; then
                    echo "✓ Web container is healthy"

                    # Double-check by hitting the health endpoint
                    if curl -f -s http://localhost:8000/health > /dev/null 2>&1; then
                        echo "✓ Health endpoint responding"
                        HEALTH_CHECK_PASSED=true
                        break
                    else
                        echo "  Health check endpoint not ready yet..."
                    fi
                else
                    echo "  Container status: $WEB_STATUS"
                fi

                echo "Waiting for health checks... ($ELAPSED/$MAX_WAIT seconds)"
                sleep 5
                ELAPSED=$((ELAPSED + 5))
            done

            if [ "$HEALTH_CHECK_PASSED" = false ]; then
                echo "❌ ERROR: Health check failed after $MAX_WAIT seconds"
                echo "Deployment may have failed. Checking logs..."
                docker compose -f "$COMPOSE_FILE" --env-file .env logs --tail=50 web
                exit 1
            fi

            echo "✓ Deployment successful - new container is healthy and serving traffic"

            echo "=== Final service status ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env ps

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo "=== Deployment complete ==="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /home/ubuntu/rentflow
            COMPOSE_FILE="docker-compose.production.yml"

            echo "=== Service Status ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env ps

            echo "=== Recent Logs ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env logs --tail=50 web

            echo "=== Health Check ==="
            curl -f http://localhost:8000/health || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          exit 1
