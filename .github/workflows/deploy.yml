name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run tests
        run: |
          pytest tests/ -v --maxfail=1
        env:
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e

            # Docker Compose file location
            COMPOSE_FILE="deployment/docker/docker-compose.yml"

            echo "=== Pre-deployment Checks ==="
            if ! command -v docker &> /dev/null; then
                echo "ERROR: Docker is not installed!"
                exit 1
            fi

            if ! command -v docker compose &> /dev/null; then
                echo "ERROR: Docker Compose is not installed!"
                exit 1
            fi

            echo "✓ Docker and Docker Compose found"

            echo "=== Starting deployment ==="
            cd /home/ubuntu/rentflow

            echo "=== Pulling latest code ==="
            # Clean any uncommitted changes
            git clean -fd
            git reset --hard HEAD
            # Fetch and reset to latest
            git fetch origin main
            git reset --hard origin/main
            echo "✓ Code updated to latest commit: $(git rev-parse --short HEAD)"

            echo "=== Verifying deployment structure ==="
            if [ ! -f "$COMPOSE_FILE" ]; then
                echo "ERROR: Docker Compose file not found at: $COMPOSE_FILE"
                exit 1
            fi
            if [ ! -f ".env" ]; then
                echo "ERROR: .env file not found at root directory"
                echo "Please create .env file with required environment variables"
                exit 1
            fi
            echo "✓ Compose file found: $COMPOSE_FILE"
            echo "✓ Environment file found: .env"

            echo "=== Creating directories with correct permissions ==="
            mkdir -p logs uploads instance backups
            chmod 777 logs uploads instance
            touch logs/access.log logs/error.log
            chmod 666 logs/access.log logs/error.log

            echo "=== Backing up PostgreSQL database ==="
            BACKUP_FILE="backups/backup-$(date +%Y%m%d-%H%M%S).sql"
            if docker compose -f "$COMPOSE_FILE" --env-file .env exec -T db pg_dump -U rentflow_user rentflow > "$BACKUP_FILE" 2>/dev/null; then
                echo "✓ Database backed up: $BACKUP_FILE"
            else
                echo "⚠ Warning: Database backup failed (might not exist yet)"
            fi

            echo "=== Cleaning up old backups (keeping last 7 days) ==="
            find backups/ -name "backup-*.sql" -type f -mtime +7 -delete 2>/dev/null || true
            BACKUP_COUNT=$(find backups/ -name "backup-*.sql" -type f 2>/dev/null | wc -l)
            echo "✓ Current backups: $BACKUP_COUNT files"

            echo "=== Building Docker images ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env build --no-cache web

            echo "=== Stopping all services ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env down 2>/dev/null || true
            echo "✓ Services stopped"

            echo "=== Ensuring SSL certificates exist for NGINX startup ==="
            # Create dummy certificates if real ones don't exist (prevents NGINX crash)
            DOMAIN="rentflow.cloud"
            if ! docker compose -f "$COMPOSE_FILE" --env-file .env run --rm --entrypoint "test -f /etc/letsencrypt/live/$DOMAIN/fullchain.pem" certbot 2>/dev/null; then
                echo "Creating temporary dummy certificates..."

                # Generate DH params if missing
                if ! docker compose -f "$COMPOSE_FILE" --env-file .env run --rm --entrypoint "test -f /etc/letsencrypt/ssl-dhparams.pem" certbot 2>/dev/null; then
                    docker compose -f "$COMPOSE_FILE" --env-file .env run --rm --entrypoint "openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048" certbot
                fi

                # Create directory and dummy certificates
                docker compose -f "$COMPOSE_FILE" --env-file .env run --rm --entrypoint "mkdir -p /etc/letsencrypt/live/$DOMAIN" certbot
                docker compose -f "$COMPOSE_FILE" --env-file .env run --rm --entrypoint "sh -c \"openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout /etc/letsencrypt/live/$DOMAIN/privkey.pem -out /etc/letsencrypt/live/$DOMAIN/fullchain.pem -subj '/CN=$DOMAIN' 2>/dev/null && cp /etc/letsencrypt/live/$DOMAIN/fullchain.pem /etc/letsencrypt/live/$DOMAIN/chain.pem\"" certbot

                echo "✓ Dummy certificates created (will be replaced with real ones later)"
            else
                echo "✓ SSL certificates already exist"
            fi

            echo "=== Running database migrations ==="
            if ! docker compose -f "$COMPOSE_FILE" --env-file .env run --rm web flask db upgrade; then
                echo "ERROR: Database migration failed!"
                echo "Attempting to restart services..."
                docker compose -f "$COMPOSE_FILE" --env-file .env up -d
                exit 1
            fi
            echo "✓ Database migrations completed"

            echo "=== Starting services ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env up -d

            echo "=== Waiting for services to be healthy ==="
            MAX_WAIT=60
            ELAPSED=0

            while [ $ELAPSED -lt $MAX_WAIT ]; do
                WEB_STATUS=$(docker compose -f "$COMPOSE_FILE" --env-file .env ps web --format "{{.Status}}" 2>/dev/null || echo "")
                DB_STATUS=$(docker compose -f "$COMPOSE_FILE" --env-file .env ps db --format "{{.Status}}" 2>/dev/null || echo "")

                if echo "$WEB_STATUS" | grep -q "healthy" && echo "$DB_STATUS" | grep -q "healthy"; then
                    echo "✓ All critical services are healthy"
                    break
                fi

                echo "Waiting for health checks... ($ELAPSED/$MAX_WAIT seconds)"
                sleep 5
                ELAPSED=$((ELAPSED + 5))
            done

            if [ $ELAPSED -ge $MAX_WAIT ]; then
                echo "⚠ Warning: Health check timeout reached"
                echo "Services may still be starting up. Check logs if issues occur."
            fi

            echo "=== Final service status ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env ps

            echo "=== Initializing SSL certificates (if needed) ==="
            # Check if SSL certificates already exist
            echo "Checking for existing certificates..."
            if docker compose -f "$COMPOSE_FILE" --env-file .env run --rm certbot certificates 2>&1 | grep -q "rentflow.cloud"; then
                echo "✓ SSL certificates already exist, skipping initialization"
                docker compose -f "$COMPOSE_FILE" --env-file .env run --rm certbot certificates 2>&1 | head -20
            else
                echo "⚠ No SSL certificates found, running SSL initialization..."
                echo "This may take 3-5 minutes (DH parameter generation + Let's Encrypt request)..."
                timeout 600 ./deployment/scripts/init-ssl.sh --yes || {
                    echo "⚠ SSL initialization failed or timed out after 10 minutes"
                    echo "This is non-fatal - HTTPS will work with dummy certificates for now"
                    echo "You can manually run: ./deployment/scripts/init-ssl.sh on the VPS"
                }
            fi

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo "=== Deployment complete ==="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /home/ubuntu/rentflow
            COMPOSE_FILE="deployment/docker/docker-compose.yml"

            echo "=== Service Status ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env ps

            echo "=== Recent Logs ==="
            docker compose -f "$COMPOSE_FILE" --env-file .env logs --tail=50 web

            echo "=== Health Check ==="
            curl -f http://localhost:8000/health || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          exit 1
