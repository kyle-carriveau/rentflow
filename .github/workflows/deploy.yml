name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run tests
        run: |
          pytest tests/ -v --maxfail=1
        env:
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            # Docker Compose file location
            COMPOSE_FILE="deployment/docker/docker-compose.yml"

            echo "=== Pre-deployment Checks ==="
            if ! command -v docker &> /dev/null; then
                echo "ERROR: Docker is not installed!"
                exit 1
            fi

            if ! command -v docker compose &> /dev/null; then
                echo "ERROR: Docker Compose is not installed!"
                exit 1
            fi

            echo "✓ Docker and Docker Compose found"

            echo "=== Starting deployment ==="
            cd /home/ubuntu/rentflow

            # Verify compose file exists
            if [ ! -f "$COMPOSE_FILE" ]; then
                echo "ERROR: Docker Compose file not found at: $COMPOSE_FILE"
                exit 1
            fi

            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Creating directories with correct permissions ==="
            mkdir -p logs uploads instance backups
            chmod 777 logs uploads instance
            touch logs/access.log logs/error.log
            chmod 666 logs/access.log logs/error.log

            echo "=== Backing up PostgreSQL database ==="
            BACKUP_FILE="backups/backup-$(date +%Y%m%d-%H%M%S).sql"
            if docker compose -f "$COMPOSE_FILE" exec -T db pg_dump -U rentflow_user rentflow > "$BACKUP_FILE" 2>/dev/null; then
                echo "✓ Database backed up: $BACKUP_FILE"
            else
                echo "⚠ Warning: Database backup failed (might not exist yet)"
            fi

            echo "=== Cleaning up old backups (keeping last 7 days) ==="
            find backups/ -name "backup-*.sql" -type f -mtime +7 -delete 2>/dev/null || true
            BACKUP_COUNT=$(find backups/ -name "backup-*.sql" -type f 2>/dev/null | wc -l)
            echo "✓ Current backups: $BACKUP_COUNT files"

            echo "=== Building Docker images ==="
            docker compose -f "$COMPOSE_FILE" build --no-cache web

            echo "=== Stopping application ==="
            docker compose -f "$COMPOSE_FILE" stop web

            echo "=== Running database migrations ==="
            if ! docker compose -f "$COMPOSE_FILE" run --rm web flask db upgrade; then
                echo "ERROR: Database migration failed!"
                echo "Attempting to restart services..."
                docker compose -f "$COMPOSE_FILE" up -d
                exit 1
            fi

            echo "=== Starting services ==="
            docker compose -f "$COMPOSE_FILE" up -d

            echo "=== Waiting for services to be healthy ==="
            MAX_WAIT=60
            ELAPSED=0

            while [ $ELAPSED -lt $MAX_WAIT ]; do
                WEB_HEALTHY=$(docker compose -f "$COMPOSE_FILE" ps web --format "table {{.Status}}" | grep -c "healthy" || echo 0)
                DB_HEALTHY=$(docker compose -f "$COMPOSE_FILE" ps db --format "table {{.Status}}" | grep -c "healthy" || echo 0)

                if [ "$WEB_HEALTHY" -ge 1 ] && [ "$DB_HEALTHY" -ge 1 ]; then
                    echo "✓ All critical services are healthy"
                    break
                fi

                echo "Waiting for health checks... ($ELAPSED/$MAX_WAIT seconds)"
                sleep 5
                ELAPSED=$((ELAPSED + 5))
            done

            if [ $ELAPSED -ge $MAX_WAIT ]; then
                echo "⚠ Warning: Health check timeout reached"
                echo "Services may still be starting up. Check logs if issues occur."
            fi

            echo "=== Final service status ==="
            docker compose -f "$COMPOSE_FILE" ps

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo "=== Deployment complete ==="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /home/ubuntu/rentflow
            COMPOSE_FILE="deployment/docker/docker-compose.yml"

            echo "=== Service Status ==="
            docker compose -f "$COMPOSE_FILE" ps

            echo "=== Recent Logs ==="
            docker compose -f "$COMPOSE_FILE" logs --tail=50 web

            echo "=== Health Check ==="
            curl -f http://localhost:8000/health || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Deployment successful!"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          exit 1
