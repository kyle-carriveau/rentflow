# HTTP-Only Configuration for Initial Let's Encrypt Setup
# This file is used temporarily during SSL certificate initialization
# After certificates are obtained, this should be removed/renamed

# Upstream Flask application
upstream rentflow_app {
    server web:8000 fail_timeout=0;
}

# HTTP Server - Allows ACME challenge and serves application
server {
    listen 80;
    server_name rentflow.cloud www.rentflow.cloud;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve the application (temporarily on HTTP only)
    location / {
        limit_req zone=general burst=20 nodelay;
        proxy_pass http://rentflow_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Static files
    location /static {
        alias /app/website/static;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded files
    location /uploads {
        alias /app/uploads;
        expires 7d;
        add_header Cache-Control "private";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://rentflow_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Client body size limit
    client_max_body_size 10M;
}
