# Upstream Flask application
upstream rentflow_app {
    server web:8000 fail_timeout=0;
}

# HTTP Server - Redirect to HTTPS
server {
    listen 80;
    server_name rentflow.cloud www.rentflow.cloud;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name rentflow.cloud www.rentflow.cloud;

    # SSL Configuration - Let's Encrypt
    # Fallback to self-signed if Let's Encrypt certs don't exist yet
    ssl_certificate /etc/letsencrypt/live/rentflow.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rentflow.cloud/privkey.pem;

    # Let's Encrypt recommended SSL options
    ssl_trusted_certificate /etc/letsencrypt/live/rentflow.cloud/chain.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL Protocol and Cipher Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body size limit (for file uploads)
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Include shared location blocks
    include /etc/nginx/conf.d/locations.inc;
}
