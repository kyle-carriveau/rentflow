# Upstream Flask application
upstream rentflow_app {
    server web:8000 fail_timeout=0;
}

# Default server - Reject requests to IP address or unknown domains
# This blocks direct IP access and provides security
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # Use Cloudflare origin cert for HTTPS (required for SSL to work)
    ssl_certificate /etc/nginx/ssl/cloudflare-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    # Return 444 (connection closed without response)
    # This prevents direct IP access and unknown domain requests
    return 444;
}

# HTTP Server - Cloudflare handles HTTP → HTTPS redirect
server {
    listen 80;
    server_name rentflow.cloud www.rentflow.cloud;

    # Include shared location blocks for HTTP
    include /etc/nginx/conf.d/locations.inc;
}

# HTTPS Server - Origin SSL for Cloudflare
server {
    listen 443 ssl;
    http2 on;
    server_name rentflow.cloud www.rentflow.cloud;

    # SSL Configuration - Cloudflare Origin Certificate
    # 15-year certificate issued by Cloudflare (trusted by Cloudflare only)
    ssl_certificate /etc/nginx/ssl/cloudflare-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    # SSL Protocol and Cipher Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body size limit (for file uploads)
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Include shared location blocks
    include /etc/nginx/conf.d/locations.inc;
}
