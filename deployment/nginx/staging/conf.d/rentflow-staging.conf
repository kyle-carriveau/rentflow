# Upstream Flask application (staging)
upstream rentflow_app {
    server web:8000 fail_timeout=0;
}

# HTTP Server - Accept all domains/IPs for staging flexibility
server {
    listen 80;
    server_name _;  # Accept any domain or IP

    # Add staging identifier
    add_header X-Environment "staging" always;

    # Include shared location blocks for HTTP
    include /etc/nginx/conf.d/locations.inc;
}

# HTTPS Server - Self-signed certificate (no Cloudflare origin pulls)
server {
    listen 443 ssl;
    http2 on;
    server_name _;  # Accept any domain or IP

    # SSL Configuration - Self-signed or staging certificate
    ssl_certificate /etc/nginx/ssl/staging.crt;
    ssl_certificate_key /etc/nginx/ssl/staging.key;

    # SSL Protocol Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Relaxed Security Headers for Staging
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Environment "staging" always;

    # Client body size limit
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Include shared location blocks
    include /etc/nginx/conf.d/locations.inc;
}
