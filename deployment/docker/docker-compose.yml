services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: rentflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentflow}
      POSTGRES_USER: ${POSTGRES_USER:-rentflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Ports removed for security - only accessible within Docker network
    # Uncomment for local development database access:
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentflow_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rentflow_network

  # Redis for Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: rentflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Ports removed for security - only accessible within Docker network
    # Uncomment for local development Redis access:
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rentflow_network

  # Flask Application
  web:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    container_name: rentflow_web
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rentflow_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rentflow}
      RATELIMIT_STORAGE_URL: redis://redis:6379/0
      SESSION_COOKIE_SECURE: "True"
      DEBUG: "False"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - ../../instance:/app/instance
      - ../../logs:/app/logs
      - ../../uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rentflow_network

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: rentflow_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../deployment/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../deployment/ssl:/etc/nginx/ssl:ro
      - ../../logs/nginx:/var/log/nginx
    depends_on:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - rentflow_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  rentflow_network:
    driver: bridge
