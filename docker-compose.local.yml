# Docker Compose for Local Development
# Mirrors production stack but optimized for local development
#
# Features:
# - Exposed database ports for DB tools (pgAdmin, DBeaver, etc.)
# - Hot reload enabled for fast development
# - Debug mode enabled
# - Relaxed security for local testing
#
# Usage:
#   Start: docker compose -f docker-compose.local.yml up -d
#   Stop:  docker compose -f docker-compose.local.yml down
#   Logs:  docker compose -f docker-compose.local.yml logs -f
#   Shell: docker compose -f docker-compose.local.yml exec web bash
#
# Or use Makefile:
#   make dev-up
#   make dev-down
#   make dev-logs

services:
  # PostgreSQL Database (Development)
  db:
    image: postgres:16-alpine
    container_name: rentflow_dev_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentflow_dev}
      POSTGRES_USER: ${POSTGRES_USER:-rentflow_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentflow_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      # EXPOSED for DB tools (pgAdmin, DBeaver, TablePlus, etc.)
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentflow_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rentflow_dev_network

  # Redis for Rate Limiting (Development)
  redis:
    image: redis:7-alpine
    container_name: rentflow_dev_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      # EXPOSED for Redis Commander or debugging
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rentflow_dev_network

  # Flask Application (Development with Hot Reload)
  web:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile
      target: development  # Use development stage if multi-stage build
    container_name: rentflow_dev_web
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-for-local-only}
      DATABASE_URL: postgresql://${POSTGRES_USER:-rentflow_dev}:${POSTGRES_PASSWORD:-rentflow_dev_password}@db:5432/${POSTGRES_DB:-rentflow_dev}
      RATELIMIT_STORAGE_URL: redis://redis:6379/0
      SESSION_COOKIE_SECURE: "False"
      DEBUG: "True"
      # Development-specific: Fewer workers for faster reload
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-1}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      # Enable hot reload
      FLASK_APP: main.py
      FLASK_DEBUG: "1"
    volumes:
      # Mount source code for hot reload
      - ./website:/app/website:ro
      - ./config:/app/config:ro
      - ./main.py:/app/main.py:ro
      # Writable volumes
      - ./instance:/app/instance
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    ports:
      - "5000:8000"  # Flask app on localhost:5000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - rentflow_dev_network

  # NGINX Reverse Proxy (Optional for local - can access web directly)
  # Uncomment if you want to test with NGINX locally
  # nginx:
  #   image: nginx:alpine
  #   container_name: rentflow_dev_nginx
  #   restart: unless-stopped
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./deployment/nginx/conf.d:/etc/nginx/conf.d:ro
  #     - ./logs/nginx:/var/log/nginx
  #     - ./website/static:/app/website/static:ro
  #     - ./uploads:/app/uploads:ro
  #   depends_on:
  #     - web
  #   networks:
  #     - rentflow_dev_network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  rentflow_dev_network:
    driver: bridge

# Development Notes:
# - PostgreSQL accessible at localhost:5432
# - Redis accessible at localhost:6379
# - Flask app accessible at localhost:5000
# - Hot reload enabled (changes reflect immediately)
# - Use pgAdmin or DBeaver to connect to local database
# - Database credentials: rentflow_dev / rentflow_dev_password / rentflow_dev
