{% extends "base.html" %} 

{% block content %} 

<div class="card mb-3" id="leasesTable" data-list='{"valueNames":["name","email","phone","address","joined"],"page":10,"pagination":true}'>
    <div class="card-header">
      <div class="row flex-between-center">
        <div class="col-4 col-sm-auto d-flex align-items-center pe-0">
          <h5 class="mb-0"><span class="fas fa-file-alt me-2"></span>Leases</h5>
        </div>
        <div class="col-8 col-sm-auto text-end ps-2">
          <div class="d-none" id="table-leases-actions">
            <div class="d-flex">
              <select class="form-select form-select-sm" aria-label="Bulk actions">
                <option selected="">Bulk actions</option>
                <option value="Refund">Refund</option>
                <option value="Delete">Delete</option>
                <option value="Archive">Archive</option>
              </select>
              <button class="btn btn-falcon-default btn-sm ms-2" type="button">Apply</button>
            </div>
          </div>
          <div id="table-leases-replace-element">
            <a class="btn btn-falcon-default btn-sm" href=""><span class="fas fa-plus" data-fa-transform="shrink-3 down-2"></span><span class="d-none d-sm-inline-block ms-1">New</span></a>
            <button class="btn btn-falcon-default btn-sm mx-2" type="button"><span class="fas fa-filter" data-fa-transform="shrink-3 down-2"></span><span class="d-none d-sm-inline-block ms-1">Filter</span></button>
            <button class="btn btn-falcon-default btn-sm" type="button"><span class="fas fa-external-link-alt" data-fa-transform="shrink-3 down-2"></span><span class="d-none d-sm-inline-block ms-1">Export</span></button>
          </div>
        </div>
      </div>
    </div>
    <div class="card-body p-0">
      <div class="table-responsive scrollbar">
        <table class="table table-hover table-striped overflow-hidden">
          <thead>
            <tr>
              <th scope="col">Actions</th>
              <th scope="col">Property</th>
              <th scope="col">Unit</th>
              <th scope="col">Tenant</th>
              <th scope="col">Start</th>
              <th scope="col">End</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          {% if leases %}
          <tbody>
            {% for lease in leases %}
            <tr class="align-middle">
              <td class="text-nowrap">
                <div>
                    <a class="btn p-0" type="button" data-bs-toggle="tooltip" data-bs-placement="top" title="Edit" href="{{ url_for('lease.update', id=lease.id) }}"><span class="text-500 fas fa-edit"></span></a>
                    <a class="btn p-0 ms-2" type="button" data-bs-toggle="tooltip" data-bs-placement="top" title="Enter" href="{{ url_for('lease.show', id=lease.id) }}"><span class="text-500 fas fa-caret-up"></span></a>
                </div>
              </td>
              <td class="text-nowrap">
                <div class="d-flex align-items-center">
                  <div class="avatar avatar-xl">
                    <div class="avatar-name rounded-circle"><span></span></div>
                  </div>
                  <div class="ms-2">{{ lease.property_id }}</div>
                </div>
              </td>
              <td class="text-nowrap"></td>
              <td class="text-nowrap"></td>
              <td class="text-nowrap"></td>
              <td class="text-nowrap"></td>
              <td><span class="badge badge rounded-pill d-block p-2 badge-soft-success">Completed<span class="ms-1 fas fa-check" data-fa-transform="shrink-2"></span></span></td>
            </tr>
            {% endfor %} 
          </tbody>
          {% endif %}
        </table>
      </div>
    </div>
    <div class="card-footer d-flex align-items-center justify-content-center">
      <button class="btn btn-sm btn-falcon-default me-1" type="button" title="Previous" data-list-pagination="prev"><span class="fas fa-chevron-left"></span></button>
      <ul class="pagination mb-0"></ul>
      <button class="btn btn-sm btn-falcon-default ms-1" type="button" title="Next" data-list-pagination="next"><span class="fas fa-chevron-right"></span></button>
    </div>
  </div>

{% endblock %}
